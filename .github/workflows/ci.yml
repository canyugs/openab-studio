name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  format:
    name: Formatting
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Rust 1.85
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: "1.85"
          components: rustfmt

      - name: Set up Node.js 22.12.0
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.12.0
          package-manager-cache: false

      - name: Set up pnpm 10.29.2
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.29.2
          cache: false

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Rust and TypeScript formatting
        run: pnpm format:check

  static-analysis:
    name: Static analysis
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install Linux Tauri build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            librsvg2-dev \
            wget

      - name: Set up Rust 1.85
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: "1.85"
          components: clippy

      - name: Set up Node.js 22.12.0
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.12.0
          package-manager-cache: false

      - name: Set up pnpm 10.29.2
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.29.2
          cache: false

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint Rust with Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Check Rust and TypeScript statically
        run: pnpm check

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install Linux Tauri build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            librsvg2-dev \
            wget

      - name: Set up Rust 1.85
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: "1.85"

      - name: Set up Node.js 22.12.0
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.12.0
          package-manager-cache: false

      - name: Set up pnpm 10.29.2
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.29.2
          cache: false

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Rust and TypeScript unit tests
        run: pnpm test

  template-validation:
    name: Template validation
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Validate issue and pull-request templates
        run: sh scripts/validate-templates.sh

  contract-compatibility:
    name: Contract compatibility fixtures
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Rust 1.85
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: "1.85"

      - name: Set up Node.js 22.12.0
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.12.0
          package-manager-cache: false

      - name: Set up pnpm 10.29.2
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.29.2
          cache: false

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify generated bindings and compatibility fixtures
        run: pnpm contracts:verify
