[workspace]
members = ["crates/studio-core", "apps/studio/src-tauri"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
tauri = { version = "=2.11.5", features = [] }
tauri-build = { version = "=2.6.3", features = [] }
